<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project · Anish Shah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="project.css?v=1791266077" />
</head>
<body>
  <header class="bar">
    <a class="bar-logo" href="index.html#subway" aria-label="Anish Shah, back to the ride"><img src="assets/brand/logo.png" alt="" width="229" height="160" /></a>
    <nav class="line pill" aria-label="Projects"><ol id="line"></ol></nav>
    <div class="bar-links pill"><a id="back" href="index.html#subway">Back to the ride</a><a href="projects.html">All projects</a></div>
  </header>

  <main>
    <!-- the page follows the flow of anishah.framer.website: title, brief, main image, then js/flow.js -->
    <header class="top">
      <p class="kicker" id="p-line"></p>
      <h1 id="p-title"></h1>
      <p class="brief" id="p-intro"></p>
    </header>
    <hr class="rule" />
    <figure class="shot hero-shot"><img id="p-hero" alt="" /></figure>

    <article class="case" id="p-case"></article>

    <p class="source"><a id="p-source" target="_blank" rel="noopener">View this project on my Framer site <span aria-hidden="true">↗</span></a></p>

    <nav class="also" aria-label="Other projects">
      <p class="also-label">See also</p>
      <ul id="also"></ul>
    </nav>
  </main>

  <div class="fade" aria-hidden="true"></div>

  <script src="js/data.js?v=1791266077"></script>
  <script src="js/flow.js?v=1791266077"></script>
  <script>
    (function () {
      const list = SITE.projects;
      const id = new URLSearchParams(location.search).get("p");
      const i = Math.max(0, list.findIndex((p) => p.id === id));
      const p = list[i], F = FLOW[p.id] || { hero: 1.5, items: [] };
      const $ = (s) => document.querySelector(s);
      const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

      document.title = p.title + " · Anish Shah";
      // the bar's metro line: one stop per project, this one lit
      list.forEach((q, k) => {
        const li = el("li"), a = el("a", k < i ? "done" : k === i ? "here" : "");
        a.href = "project.html?p=" + q.id; if (k === i) a.setAttribute("aria-current", "page");
        a.append(el("i"), el("span", null, q.title)); li.append(a); $("#line").append(li);
      });
      $("#line").style.setProperty("--n", list.length);
      $("#line").style.setProperty("--at", list.length > 1 ? i / (list.length - 1) : 0);

      $("#p-line").textContent = [p.meta.category, p.meta.year].filter(Boolean).join(" · ");
      $("#p-title").textContent = p.title;
      $("#p-intro").textContent = p.intro;
      const hero = p.hero || p.cover;
      $("#p-hero").src = SITE.img(hero); $("#p-hero").alt = p.title + ": " + p.blurb;
      $(".hero-shot").style.setProperty("--ar", F.hero);
      $("#p-source").href = p.source;

      const root = $("#p-case");
      const shot = (c, size) => {
        const f = el("figure", "shot"), img = el("img");
        f.style.setProperty("--ar", c.ar);
        if (c.l != null) { f.style.marginLeft = c.l + "%"; f.style.width = c.w + "%"; }
        img.src = SITE.img(c.id, size); img.alt = p.title + " image"; img.loading = "lazy"; img.decoding = "async";
        if (c.fit && c.fit !== "cover") img.style.objectFit = c.fit;
        f.append(img); return f;
      };
      const labels = { year: "Year", timeframe: "Timeframe", tools: "Tools", category: "Category", collaboration: "Collaboration" };
      F.items.forEach((b) => {
        let e;
        if (b.t === "h") e = el(b.big ? "h2" : "h3", b.big ? "sec" : "", b.tx);
        else if (b.t === "p") e = el("p", b.narrow ? "narrow" : "", b.tx);
        else if (b.t === "rule") e = el("hr", "rule");
        else if (b.t === "list") {
          e = el("ol", "features");
          b.items.forEach(([t, d]) => { const li = el("li"); li.append(el("b", null, t), el("span", null, d)); e.append(li); });
        } else if (b.t === "lead") {                       // the big statement, with the facts beside it
          e = el("section", "lead");
          const dl = el("dl", "facts");
          Object.entries(labels).forEach(([k, label]) => { if (!p.meta[k]) return; const d = el("div"); d.append(el("dt", null, label), el("dd", null, p.meta[k])); dl.append(d); });
          e.append(el("p", "lead-text", p.lead), dl);
        } else if (b.t === "row") {
          e = el("div", "row" + (b.bleed ? " bleed" : "") + (b.tight ? " tight" : ""));
          b.imgs.forEach((c) => e.append(shot(c, b.bleed || c.w > 60 ? 2048 : 1024)));
        } else if (b.t === "video") {
          e = el("figure", "shot"); e.style.setProperty("--ar", b.ar);
          const v = el("video"); v.src = b.src; v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true; v.setAttribute("aria-label", p.title + " video");
          e.append(v);
        } else if (b.t === "ticker") {                     // a strip of photos sliding sideways (shown twice over, so it loops)
          e = el("div", "ticker"); const track = el("div", "ticker-track");
          [0, 1].forEach(() => b.imgs.forEach((c) => track.append(shot({ id: c.id, ar: c.ar }, 1024))));
          e.append(track);
        } else if (b.t === "tiles") {                      // a tilted wall of tiles, its columns drifting past each other
          e = el("div", "tiles"); const wall = el("div", "tiles-wall");
          [0, 1, 2].forEach((c) => {
            const col = el("div", "tiles-col"), mine = b.imgs.filter((_, k) => k % 3 === c);
            [...mine, ...mine, ...mine, ...mine].forEach((id) => { const im = el("img"); im.src = SITE.img(id, 1024); im.alt = ""; im.loading = "lazy"; col.append(im); });
            wall.append(col);
          });
          e.append(wall);
        }
        if (e) root.append(e);
      });

      // see also: the other projects
      list.filter((q) => q.id !== p.id).forEach((q) => {
        const li = el("li"), a = el("a"); a.href = "project.html?p=" + q.id;
        const im = el("img"); im.src = SITE.img(q.cover, 512); im.alt = ""; im.loading = "lazy";
        const tx = el("span", "also-text"); tx.append(el("small", null, q.meta.category || ""), el("b", null, q.title));
        a.append(im, tx, el("i", null, "↗")); li.append(a); $("#also").append(li);
      });

      // things come up as they scroll into view
      const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -6% 0px" });
      document.querySelectorAll(".case > *, .also li").forEach((e) => { e.classList.add("rise"); io.observe(e); });

      $("#back").href = "index.html#project-" + p.id;
    })();
  </script>
</body>
</html>
