<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project · Anish Shah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="project.css?v=1791196198" />
</head>
<body>
  <header class="bar">
    <a class="bar-logo" href="index.html#subway" aria-label="Anish Shah, back to the ride"><img src="assets/brand/logo.png" alt="" width="229" height="160" /></a>
    <nav class="line pill" aria-label="Projects"><ol id="line"></ol></nav>
    <div class="bar-links pill"><a id="back" href="index.html#subway">Back to the ride</a><a href="projects.html">All projects</a></div>
  </header>

  <main>
    <section class="top">
      <span class="star" style="left:6%;top:22%"></span><span class="star s2" style="right:9%;top:16%"></span><span class="star s3" style="right:22%;bottom:18%"></span>
      <p class="kicker" id="p-line"></p>
      <h1 id="p-title"></h1>
      <p class="brief" id="p-intro"></p>
      <dl class="ticket" id="p-meta"></dl>
    </section>

    <figure class="board hero-board"><img id="p-hero" alt="" /></figure>

    <p class="lead" id="p-lead"></p>

    <article class="case" id="p-case"></article>

    <p class="source"><a id="p-source" target="_blank" rel="noopener">View this project on my Framer site <span aria-hidden="true">↗</span></a></p>
  </main>

  <a class="next" id="next">
    <span class="next-art" aria-hidden="true"></span>
    <span class="next-in">
      <span class="kicker">Next stop</span>
      <b id="next-title"></b>
      <span class="next-blurb" id="next-blurb"></span>
      <span class="go">Ride on <i aria-hidden="true">→</i></span>
    </span>
    <span class="board next-board"><img id="next-img" alt="" loading="lazy" /></span>
  </a>

  <div class="fade" aria-hidden="true"></div>

  <script src="js/data.js?v=1791196198"></script>
  <script>
    (function () {
      const list = SITE.projects;
      const id = new URLSearchParams(location.search).get("p");
      const i = Math.max(0, list.findIndex((p) => p.id === id));
      const p = list[i], next = list[(i + 1) % list.length];
      const $ = (s) => document.querySelector(s);
      const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

      document.title = p.title + " · Anish Shah";
      // the bar's metro line: one stop per project, this one lit
      list.forEach((q, k) => {
        const li = el("li"), a = el("a", k < i ? "done" : k === i ? "here" : "");
        a.href = "project.html?p=" + q.id; if (k === i) a.setAttribute("aria-current", "page");
        a.append(el("i"), el("span", null, q.title)); li.append(a); $("#line").append(li);
      });
      $("#line").style.setProperty("--n", list.length);
      $("#line").style.setProperty("--at", list.length > 1 ? i / (list.length - 1) : 0);

      $("#p-line").textContent = [p.line, p.meta.category, p.meta.year].filter(Boolean).join(" · ");
      $("#p-title").textContent = p.title;
      $("#p-intro").textContent = p.intro;
      $("#p-lead").textContent = p.lead;
      const hero = p.hero || p.cover;
      $("#p-hero").src = SITE.img(hero); $("#p-hero").alt = p.title + ": " + p.blurb;
      $("#p-source").href = p.source;

      // the ticket: only the fields this project has
      const labels = { timeframe: "Timeframe", tools: "Tools", collaboration: "Team", year: "Year" };
      Object.entries(labels).forEach(([k, label]) => {
        if (!p.meta[k]) return;
        const d = el("div"); d.append(el("dt", null, label), el("dd", null, p.meta[k])); $("#p-meta").append(d);
      });

      // case study: a heading opens a numbered chapter, paragraphs fill it, runs of images become rows
      const root = $("#p-case");
      let box = null, run = [], n = 0;
      const figure = (b) => {
        const f = el("figure", "board");
        f.style.setProperty("--ar", b.w / b.h);
        const img = el("img");
        img.src = SITE.img(b.img, b.w / b.h > 2.5 ? 2048 : 1024 + (b.w > b.h ? 1024 : 0));
        img.alt = p.title + " image"; img.loading = "lazy"; img.decoding = "async";
        img.width = b.w; img.height = b.h;
        f.append(img); return f;
      };
      const flush = () => {
        if (!run.length) return;
        // banners run full width; the rest go in rows of 2 (landscape) or 3 (portrait), equal heights
        let row = [];
        const put = () => { if (!row.length) return; const r = el("div", "row"); row.forEach((b) => r.append(figure(b))); root.append(r); row = []; };
        run.forEach((b) => {
          if (b.w / b.h > 2.5) { put(); row.push(b); put(); return; }
          row.push(b);
          if (row.length >= (row.every((x) => x.h > x.w) ? 3 : 2)) put();
        });
        put(); run = [];
      };
      const chapter = (title) => {
        box = el("section", "chapter");
        if (title) { const h = el("h2"); h.append(el("small", null, String(++n).padStart(2, "0")), title); box.append(h); }
        box.append(el("div", "chapter-text")); root.append(box);
      };
      p.blocks.forEach((b) => {
        if (b.img) { run.push(b); box = null; return; }
        flush();
        if (b.h) { chapter(b.h); return; }
        if (!box) chapter();
        const into = box.lastChild;
        if (b.p) into.append(el("p", null, b.p));
        if (b.list) {
          const ul = el("ul", "features");
          b.list.forEach(([t, d]) => { const li = el("li"); li.append(el("b", null, t), el("span", null, d)); ul.append(li); });
          into.append(ul);
        }
      });
      flush();

      // things come up as they scroll into view
      const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px" });
      document.querySelectorAll(".lead, .chapter, .row, .next-in, .next-board").forEach((e) => { e.classList.add("rise"); io.observe(e); });

      $("#back").href = "index.html#project-" + p.id;
      $("#next").href = "project.html?p=" + next.id;
      $("#next-title").textContent = next.title;
      $("#next-blurb").textContent = next.blurb;
      $("#next-img").src = SITE.img(next.cover, 1024);
      $(".next-art").style.setProperty("--pan", (((i + 1) % list.length) / Math.max(1, list.length - 1) * 100) + "%");
    })();
  </script>
</body>
</html>
