<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project · Neon Bharat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen&family=VT323&family=Noto+Sans+Devanagari:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=1790717283" />
  <link rel="stylesheet" href="project.css?v=1790717283" />
</head>
<body class="project-page" data-location="subway">
  <header class="hud">
    <a class="btn btn-sm" id="back" href="index.html#subway">&lt; Back to platform</a>
    <p class="hud-station" aria-live="polite">NOW ARRIVING · <span id="hud-name"></span></p>
  </header>

  <main class="carriage">
    <section class="arrival">
      <div class="station-board big">
        <span class="bb-line" id="p-line"></span>
        <h1 id="p-title"></h1>
        <span class="station-sub" id="p-intro"></span>
      </div>
      <dl class="meta" id="p-meta"></dl>
    </section>

    <figure class="hero-frame">
      <img class="work-media" id="p-hero" alt="" />
    </figure>

    <p class="lead" id="p-lead"></p>

    <article class="case" id="p-case"></article>

    <nav class="next-station" aria-label="Next project">
      <a class="source-link" id="p-source" target="_blank" rel="noopener">View on my Framer site</a>
      <span>NEXT STATION</span>
      <a class="btn" id="next"></a>
    </nav>
  </main>

  <div class="pixel-wipe" aria-hidden="true"></div>

  <script src="js/data.js?v=1790717283"></script>
  <script>
    (function () {
      const list = SITE.projects;
      const id = new URLSearchParams(location.search).get("p");
      const i = Math.max(0, list.findIndex((p) => p.id === id));
      const p = list[i], next = list[(i + 1) % list.length];
      const $ = (s) => document.querySelector(s);
      const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

      document.title = p.title + " · " + SITE.name;
      document.body.style.setProperty("--band", p.band);
      $("#hud-name").textContent = p.title.toUpperCase();
      $("#p-line").textContent = p.line + " · " + (p.meta.category || "");
      $("#p-title").textContent = p.title;
      $("#p-intro").textContent = p.intro;
      $("#p-lead").textContent = p.lead;
      const hero = p.hero || p.cover;
      $("#p-hero").src = SITE.img(hero); $("#p-hero").alt = p.title + ": " + p.blurb;
      $("#p-source").href = p.source;

      // meta: only the fields this project has
      const labels = { year: "Year", timeframe: "Timeframe", tools: "Tools", category: "Category", collaboration: "Team" };
      Object.entries(labels).forEach(([k, label]) => {
        if (!p.meta[k]) return;
        const d = el("div"); d.append(el("dt", null, label), el("dd", null, p.meta[k])); $("#p-meta").append(d);
      });

      // case study: headings open a dialog box, paragraphs fill it, runs of images become rows
      const root = $("#p-case");
      let box = null, run = [];
      const figure = (b) => {
        const f = el("figure", "case-img");
        f.style.setProperty("--ar", b.w / b.h);
        const img = el("img", "work-media");
        img.src = SITE.img(b.img, b.w / b.h > 2.5 ? 2048 : 1024 + (b.w > b.h ? 1024 : 0));
        img.alt = p.title + " image"; img.loading = "lazy"; img.decoding = "async";
        img.width = b.w; img.height = b.h;
        f.append(img); return f;
      };
      const flush = () => {
        if (!run.length) return;
        // banners run full width; the rest go in rows of 2 (landscape) or 3 (portrait), equal heights
        let row = [];
        const put = () => { if (!row.length) return; const r = el("div", "gallery-row"); row.forEach((b) => r.append(figure(b))); root.append(r); row = []; };
        run.forEach((b) => {
          if (b.w / b.h > 2.5) { put(); row.push(b); put(); return; }
          row.push(b);
          if (row.length >= (row.every((x) => x.h > x.w) ? 3 : 2)) put();
        });
        put(); run = [];
      };
      p.blocks.forEach((b) => {
        if (b.img) { run.push(b); box = null; return; }
        flush();
        if (b.h) { box = el("section", "dialog"); box.append(el("h2", null, b.h)); root.append(box); return; }
        if (!box) { box = el("section", "dialog"); root.append(box); }
        if (b.p) box.append(el("p", null, b.p));
        if (b.list) {
          const ul = el("ul", "features");
          b.list.forEach(([t, d]) => { const li = el("li"); li.append(el("b", null, t), el("span", null, d)); ul.append(li); });
          box.append(ul);
        }
      });
      flush();

      $("#back").href = "index.html#project-" + p.id;
      $("#next").href = "project.html?p=" + next.id;
      $("#next").textContent = next.title + " >";
    })();
  </script>
</body>
</html>
