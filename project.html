<body>
  <!-- the same bar as the home page: logo, the sections in a capsule, and the Ride | Simple button -->
  <header class="bar">
    <a class="bar-logo" href="index.html" aria-label="Anish Shah, home"><img src="assets/brand/logo.png" alt="" width="229" height="160" /></a>
    <nav class="route pill" aria-label="Sections">
      <ol>
        <li><a href="index.html#street">Home</a></li>
        <li><a href="index.html#drain">About</a></li>
        <li><a href="index.html#subway" class="here" aria-current="true">Projects</a></li>
        <li><a href="index.html#cinema">Play</a></li>
        <li><a href="index.html#rooftop">Contact</a></li>
        <li class="sep" aria-hidden="true"></li>
        <li><a class="all" href="projects.html"><span class="l">All projects</span><span class="s">All</span></a></li>
      </ol>
    </nav>
    <div class="view-switch pill" role="group" aria-label="View">
      <button type="button" data-view="ride" title="Travel through the world as you scroll">Ride</button>
      <button type="button" data-view="static" title="A regular page, no journey">Simple</button>
    </div>
  </header>

  <!-- the opening: the main picture across the whole screen, the title on it, the facts in its corner -->
  <header class="hero">
    <img id="p-hero" alt="" />
    <div class="hero-in">
      <div class="hero-title">
        <p class="kicker" id="p-line"></p>
        <h1 id="p-title"></h1>
        <p class="brief" id="p-intro"></p>
      </div>
      <dl class="facts" id="p-facts"></dl>
    </div>
  </header>

  <!-- the chapters, at the left while the page scrolls (wide screens) -->
  <nav class="index" aria-label="On this page"><ol id="index"></ol></nav>

  <main>
    <!-- what follows comes from js/flow.js, in the order of the project's own page -->
    <article class="case" id="p-case"></article>

    <p class="source"><a id="p-source" target="_blank" rel="noopener">View this project on my Framer site <span aria-hidden="true">↗</span></a></p>

    <nav class="also" aria-label="Other projects">
      <p class="also-label">See also</p>
      <ul id="also"></ul>
    </nav>
  </main>

  <div class="fade" aria-hidden="true"></div>

  <script src="js/data.js?v=1791400905"></script>
  <script src="js/flow.js?v=1791400905"></script>
  <script>
    (function () {
      const list = SITE.projects;
      const id = new URLSearchParams(location.search).get("p");
      // Ride | Simple, as on the home page: shows the view in use, and choosing one opens the home page in that view, at the hero
      const view = (() => { try { return localStorage.getItem("view-mode"); } catch (e) { return null; } })() === "static" ? "static" : "ride";
      document.querySelectorAll(".view-switch button").forEach((b) => {
        b.setAttribute("aria-pressed", String(b.dataset.view === view));
        b.addEventListener("click", () => { try { localStorage.setItem("view-mode", b.dataset.view); } catch (e) { /* ignore */ } location.href = "index.html"; });
      });
      const i = list.findIndex((p) => p.id === id);
      if (i < 0) {                                         // no such project (or no ?p=): say so, and show nothing of any project
        document.title = "Project not found · Anish Shah";
        document.body.classList.add("not-found");
        document.querySelector(".hero").remove(); document.querySelector(".index").remove();
        document.querySelector("main").innerHTML = `<section class="lost"><p class="kicker">Project not found</p><h1>There is no project here.</h1><p class="lost-links"><a class="x-link solid" href="projects.html">All projects</a><a class="x-link" href="index.html">Back to the ride</a></p></section>`;
        return;
      }
      const p = list[i], F = FLOW[p.id] || { hero: 1.5, items: p.nda ? [{ t: "lead" }, { t: "nda" }] : [] };
      const $ = (s) => document.querySelector(s);
      const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

      document.title = p.title + " · Anish Shah";
      document.body.dataset.project = p.id; document.body.classList.toggle("is-nda", !!p.nda);                  // the page takes on this project's character (project.css)
      $("#p-line").textContent = [p.meta.category, p.meta.year].filter(Boolean).join(" · ");
      $("#p-title").textContent = p.title;
      $("#p-intro").textContent = p.intro;
      const hero = p.hero || p.cover;
      const frame = (src, title) => { const f = el("iframe"); f.src = src; f.title = title; f.loading = "lazy"; f.allow = "autoplay; fullscreen; picture-in-picture"; f.allowFullscreen = true; return f; };
      $("#p-hero").src = SITE.img(hero); $("#p-hero").alt = p.title + ": " + p.blurb;
      const labels = { year: "Year", timeframe: "Timeframe", tools: "Tools", collaboration: "Collaboration" };
      Object.entries(labels).forEach(([k, label]) => { if (!p.meta[k]) return; const d = el("div"); d.append(el("dt", null, label), el("dd", null, p.meta[k])); $("#p-facts").append(d); });
      if (p.source) $("#p-source").href = p.source; else $(".source").hidden = true;
      if (p.sourceLabel) $("#p-source").firstChild.textContent = p.sourceLabel + " ";

      const root = $("#p-case");
      const shot = (c, size) => {
        const f = el("figure", "shot"), img = el("img");
        f.style.setProperty("--ar", c.ar);
        if (c.l != null) { f.style.marginLeft = c.l + "%"; f.style.width = c.w + "%"; }
        img.src = SITE.img(c.id, size); img.alt = c.alt || ""; img.loading = "lazy"; img.decoding = "async";
        if (c.fit && c.fit !== "cover") img.style.objectFit = c.fit;
        f.append(img); return f;
      };
      // chapters: a heading, or an item marked as a chapter's start, gets a place in the index
      const chapters = [];
      const chapter = (name, e) => { e.id = "c" + chapters.length; e.dataset.chapter = name; const li = el("li"), a = el("a", null, name); a.href = "#" + e.id; li.append(a); $("#index").append(li); chapters.push([e, a]); };
      const items = p.heroEmbed ? [{ t: "embed", src: p.heroEmbed, ar: 1.778, chapter: "The film" }, ...F.items] : F.items;   // a film that opened the old page now follows the opening
      items.forEach((b) => {
        let e;
        if (b.t === "h") e = el(b.big ? "h2" : b.sub ? "h4" : "h3", b.big ? "sec" : "", b.tx);
        else if (b.t === "p") e = el("p", b.narrow ? "narrow" : "", b.tx);
        else if (b.t === "rule") e = el("hr", "rule");
        else if (b.t === "quote") e = el("blockquote", "pull", b.tx);
        else if (b.t === "nda") { e = el("p", "nda-note"); const a = el("a", null, "Get in touch"); a.href = "mailto:" + SITE.email + "?subject=" + encodeURIComponent(p.title); e.append(el("b", null, "NDA"), el("span", null, "Under non-disclosure. Details on request."), a); }
        else if (b.t === "table") {
          e = el("div", "tablewrap"); const t = el("table"); e.append(t);
          if (b.head) { const tr = el("tr"); b.head.forEach((c) => tr.append(el("th", null, c))); t.append(tr); }
          b.rows.forEach((r) => { const tr = el("tr"); r.forEach((c, k) => tr.append(el(k ? "td" : "th", null, c))); t.append(tr); });
          if (!b.head) t.classList.add("facts-table");
        } else if (b.t === "swatches") {
          e = el("ul", "swatches");
          b.inks.forEach(([name, hex, use]) => { const li = el("li"); const chip = el("i"); chip.style.background = hex; li.append(chip, el("b", null, name), el("code", null, hex), el("span", null, use)); e.append(li); });
        } else if (b.t === "list") {
          e = el("ol", "features" + (b.plain ? " plain" : ""));
          b.items.forEach(([t, d]) => { const li = el("li"); li.append(el("b", null, t), el("span", null, d)); e.append(li); });
        } else if (b.t === "lead") {                       // the big statement
          // its first sentence is set large; the rest follows as an ordinary paragraph
          const cut = p.nda ? -1 : p.lead.search(/[.!?]\s/), first = cut > 20 ? p.lead.slice(0, cut + 1) : p.lead, rest = cut > 20 ? p.lead.slice(cut + 2) : "";
          e = el("p", "lead", first);
          if (rest) { root.append(e); if (b.chapter) chapter(b.chapter, e); root.append(el("p", null, rest)); return; }
        } else if (b.t === "row") {
          e = el("div", "row" + (b.bleed ? " bleed" : "") + (b.tight ? " tight" : "") + (b.snug ? " snug" : "") + (b.photos ? " photos" : ""));
          e.style.setProperty("--rh", Math.max(...b.imgs.map((c) => c.w / c.ar)).toFixed(2));   // its height, in % of its width
          b.imgs.forEach((c) => e.append(shot(c, c.w > 40 ? 2048 : 1024)));
          if (b.cap) { root.append(e); if (b.chapter) chapter(b.chapter, e); root.append(el("p", "cap", b.cap)); return; }
        } else if (b.t === "video") {
          e = el("figure", "shot"); e.style.setProperty("--ar", b.ar);
          const v = el("video"); v.src = b.src; v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true; v.setAttribute("aria-label", p.title + " video");
          e.append(v);
        } else if (b.t === "embed") {
          e = el("figure", "shot" + (b.tight ? " tight" : "")); e.style.setProperty("--ar", b.ar);
          e.append(frame(b.src, p.title));
        } else if (b.t === "ticker") {                     // a strip of photos sliding sideways (shown twice over, so it loops)
          e = el("div", "ticker"); const track = el("div", "ticker-track");
          [0, 1].forEach((pass) => b.imgs.forEach((c) => track.append(shot({ id: c.id, ar: c.ar, alt: pass ? "" : c.alt }, 1024))));   // (the second pass only makes the loop: described once)
          e.append(track);
        } else if (b.t === "tiles") {                      // a tilted wall of tiles, its columns drifting past each other
          e = el("div", "tiles"); const wall = el("div", "tiles-wall");
          [0, 1, 2].forEach((c) => {
            const col = el("div", "tiles-col"), mine = b.imgs.filter((_, k) => k % 3 === c);
            [...mine, ...mine, ...mine, ...mine].forEach((id, n) => { const im = el("img"); im.src = SITE.img(id, 1024); im.alt = n < mine.length ? (b.alts || [])[b.imgs.indexOf(id)] || "" : ""; im.loading = "lazy"; col.append(im); });
            wall.append(col);
          });
          e.append(wall);
        }
        if (!e) return;
        root.append(e);
        if (b.chapter) chapter(b.chapter, e); else if (b.t === "h" && !b.sub) chapter(b.nav || b.tx, e);
      });
      // outcome and learnings: only when the project has some
      const outcome = (p.outcome || []).filter((t) => t && t.trim());
      if (outcome.length) { const h = el("h3", null, "Outcome and learnings"); root.append(h); chapter("Outcome", h); outcome.forEach((t) => root.append(el("p", null, t))); }

      // the index follows the scroll: the chapter in view is lit; it shows only between the opening and the end
      const pictures = [...document.querySelectorAll(".case > .row, .case > .shot, .case > .ticker, .case > .tiles, .case > .swatches")];
      const follow = () => {
        const y = innerHeight * 0.4; let on = 0;
        chapters.forEach(([e], k) => { if (e.getBoundingClientRect().top < y) on = k; });
        chapters.forEach(([, a], k) => a.classList.toggle("here", k === on));
        // ...and only beside words: whenever a picture, film or strip passes behind it, it steps out of the way
        const box = $("#index").getBoundingClientRect(), pad = 28;
        const covered = pictures.some((e) => { const r = e.getBoundingClientRect(); return r.bottom > box.top - pad && r.top < box.bottom + pad && r.left < box.right + pad && r.right > box.left - pad; });
        document.body.classList.toggle("reading", !covered && $(".hero").getBoundingClientRect().bottom < box.top - pad && $(".source").getBoundingClientRect().top > box.bottom + pad);
      };
      if (chapters.length > 1) { addEventListener("scroll", follow, { passive: true }); addEventListener("resize", follow); follow(); } else $(".index").hidden = true;

      // see also: the other projects
      list.filter((q) => q.id !== p.id).forEach((q) => {
        const li = el("li"), a = el("a"); a.href = "project.html?p=" + q.id; li.dataset.project = q.id;
        const im = el("img"); im.src = SITE.img(q.cover, 512); im.alt = q.title + " cover"; im.loading = "lazy";
        const tx = el("span", "also-text"); tx.append(el("small", null, q.meta.category || ""), el("b", null, q.title));
        a.append(im, tx, el("i", null, "↗")); li.append(a); $("#also").append(li);
      });

      // things come up as they scroll into view
      const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -6% 0px" });
      document.querySelectorAll(".case > *:not(.row):not(.tiles):not(.ticker), .also li").forEach((e) => { e.classList.add("rise"); io.observe(e); });

      document.querySelector(".route a.here").href = "index.html#project-" + p.id;      // "Projects" returns to this project's billboard
    })();
  </script>
</body>
</html>
