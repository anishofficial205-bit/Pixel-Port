<body class="all">
  <!-- the same bar as the home page: logo, the sections in a capsule, and the Ride | Simple button -->
  <header class="bar">
    <a class="bar-logo" href="index.html" aria-label="Anish Shah, home"><img src="assets/brand/logo.png" alt="" width="229" height="160" /></a>
    <nav class="route pill" aria-label="Sections">
      <ol>
        <li><a href="index.html#street">Home</a></li>
        <li><a href="index.html#drain">About</a></li>
        <li><a href="index.html#subway">Projects</a></li>
        <li><a href="index.html#cinema">Play</a></li>
        <li><a href="index.html#rooftop">Contact</a></li>
        <li class="sep" aria-hidden="true"></li>
        <li><a class="all here" href="projects.html" aria-current="page"><span class="l">All projects</span><span class="s">All</span></a></li>
      </ol>
    </nav>
    <div class="view-switch pill" role="group" aria-label="View">
      <button type="button" data-view="ride" title="Travel through the world as you scroll">Ride</button>
      <button type="button" data-view="static" title="A regular page, no journey">Simple</button>
    </div>
  </header>

  <main class="genres">
    <!-- the domains are the page's menu, like genres: pick one and the stills on the right are only those projects -->
    <aside class="side">
      <h1 class="sr-only">All projects</h1>
      <p class="kicker">Filter by domain</p>
      <div class="filters" role="group" aria-label="Filter by domain" id="filters"></div>
    </aside>
    <ul class="stage" id="grid"></ul>
  </main>

  <div class="fade" aria-hidden="true"></div>

  <script src="js/dims.js?v=1791451439"></script>
  <script src="js/data.js?v=1791451439"></script>
  <script>
    (function () {
      const S = SITE, $ = (s) => document.querySelector(s);
      // Ride | Simple, as on the home page: shows the view in use, and choosing one opens the home page in that view, at the hero
      const view = (() => { try { return localStorage.getItem("view-mode"); } catch (e) { return null; } })() === "static" ? "static" : "ride";
      document.querySelectorAll(".view-switch button").forEach((b) => {
        b.setAttribute("aria-pressed", String(b.dataset.view === view));
        b.addEventListener("click", () => { try { localStorage.setItem("view-mode", b.dataset.view); } catch (e) { /* ignore */ } location.href = "index.html"; });
      });
      const cats = [...new Set(S.projects.map((p) => p.meta.category).filter(Boolean))];
      let active = new URLSearchParams(location.search).get("c") || "All";
      if (active !== "All" && !cats.includes(active)) active = "All";

      const count = (c) => S.projects.filter((p) => c === "All" || p.meta.category === c).length;
      $("#filters").innerHTML = ["All", ...cats].map((c) =>
        `<button class="genre" type="button" data-c="${c}" aria-pressed="${c === active}">${c === "All" ? "All<span> projects</span>" : c.replace(" Design", "")}<small>${count(c)}</small></button>`).join("");

      $("#grid").innerHTML = S.projects.map((p, k) => `
        <li class="still" data-c="${p.meta.category || ""}">
          <a href="project.html?p=${p.id}">
            <img src="${S.img(p.hero || p.cover, 2048)}" alt="${p.title} cover" loading="${k < 3 ? "eager" : "lazy"}" decoding="async" />
            <span class="still-in">
              <span class="still-meta">${[p.meta.category, p.meta.year].filter(Boolean).join(" · ")}</span>
              <span class="still-title">${p.title}</span>
              <span class="still-blurb">${p.blurb}</span>
            </span>
            <span class="still-go" aria-hidden="true">View project <b>→</b></span>
          </a>
        </li>`).join("");

      const apply = (jump) => {
        document.querySelectorAll(".still").forEach((li) => (li.hidden = !(active === "All" || li.dataset.c === active)));
        document.querySelectorAll(".genre").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.c === active)));
        const u = new URL(location.href);
        active === "All" ? u.searchParams.delete("c") : u.searchParams.set("c", active);
        history.replaceState(null, "", u);
        if (jump) scrollTo({ top: 0, behavior: "smooth" });
      };
      $("#filters").addEventListener("click", (e) => {
        const b = e.target.closest(".genre"); if (!b) return;
        active = b.dataset.c; apply(true);
      });
      apply();
    })();
  </script>
</body>
</html>
