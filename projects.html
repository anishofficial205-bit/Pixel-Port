<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>All projects · Anish Shah</title>
  <meta name="description" content="Every project by Anish Shah: branding, packaging, UI/UX and editorial design." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="project.css?v=1791355512" />
</head>
<body class="all">
  <!-- the same bar as the home page: logo, the sections in a capsule, and the Ride | Simple button -->
  <header class="bar">
    <a class="bar-logo" href="index.html" aria-label="Anish Shah, home"><img src="assets/brand/logo.png" alt="" width="229" height="160" /></a>
    <nav class="route pill" aria-label="Sections">
      <ol>
        <li><a href="index.html#street">Home</a></li>
        <li><a href="index.html#drain">About</a></li>
        <li><a href="index.html#subway">Projects</a></li>
        <li><a href="index.html#cinema">Play</a></li>
        <li><a href="index.html#rooftop">Contact</a></li>
        <li class="sep" aria-hidden="true"></li>
        <li><a class="all here" href="projects.html" aria-current="page"><span class="l">All projects</span><span class="s">All</span></a></li>
      </ol>
    </nav>
    <div class="view-switch pill" role="group" aria-label="View">
      <button type="button" data-view="ride" title="Travel through the world as you scroll">Ride</button>
      <button type="button" data-view="static" title="A regular page, no journey">Simple</button>
    </div>
  </header>

  <main>
    <!-- the same language as a project page: a quiet title, then each project as a wide panel in its own colours -->
    <header class="top">
      <p class="kicker"><span id="count"></span><span class="hi">सभी प्रोजेक्ट्स</span></p>
      <h1>All projects</h1>
      <div class="filters" role="group" aria-label="Filter by category" id="filters"></div>
    </header>

    <ul class="panels" id="grid"></ul>
  </main>

  <div class="fade" aria-hidden="true"></div>

  <script src="js/data.js?v=1791355512"></script>
  <script>
    (function () {
      const S = SITE, $ = (s) => document.querySelector(s);
      // Ride | Simple, as on the home page: shows the view in use, and choosing one goes back there in that view
      const view = (() => { try { return localStorage.getItem("view-mode"); } catch (e) { return null; } })() === "static" ? "static" : "ride";
      document.querySelectorAll(".view-switch button").forEach((b) => {
        b.setAttribute("aria-pressed", String(b.dataset.view === view));
        b.addEventListener("click", () => { try { localStorage.setItem("view-mode", b.dataset.view); } catch (e) { /* ignore */ } location.href = "index.html#subway"; });
      });
      const cats = [...new Set(S.projects.map((p) => p.meta.category).filter(Boolean))];
      let active = new URLSearchParams(location.search).get("c") || "All";
      if (active !== "All" && !cats.includes(active)) active = "All";

      $("#filters").innerHTML = ["All", ...cats].map((c) =>
        `<button class="chip" type="button" data-c="${c}" aria-pressed="${c === active}">${c}</button>`).join("");

      $("#grid").innerHTML = S.projects.map((p, k) => `
        <li class="panel" data-c="${p.meta.category || ""}" data-project="${p.id}">
          <a href="project.html?p=${p.id}">
            <img src="${S.img(p.hero || p.cover, 2048)}" alt="" loading="${k < 2 ? "eager" : "lazy"}" decoding="async" />
            <span class="panel-in">
              <span class="panel-meta">${String(k + 1).padStart(2, "0")}<i></i>${[p.meta.category, p.meta.year].filter(Boolean).join(" · ")}</span>
              <span class="panel-title">${p.title}</span>
              <span class="panel-blurb">${p.blurb}</span>
            </span>
            <span class="panel-go" aria-hidden="true">View project <b>→</b></span>
          </a>
        </li>`).join("");

      const apply = () => {
        let n = 0;
        document.querySelectorAll(".panel").forEach((li) => {
          const show = active === "All" || li.dataset.c === active;
          li.hidden = !show; if (show) n++;
        });
        document.querySelectorAll(".chip").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.c === active)));
        $("#count").textContent = `${n} project${n === 1 ? "" : "s"}${active === "All" ? "" : " · " + active}`;
        const u = new URL(location.href);
        active === "All" ? u.searchParams.delete("c") : u.searchParams.set("c", active);
        history.replaceState(null, "", u);
      };
      $("#filters").addEventListener("click", (e) => {
        const b = e.target.closest(".chip"); if (!b) return;
        active = b.dataset.c; apply();
      });
      apply();
    })();
  </script>
</body>
</html>
